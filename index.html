<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070914">
  <meta name="description" content="Race the neon-lit streets and become a legend in NEON RACER.">
  <title>NEON RACER — STREET LEGENDS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="Neon Racer home"><span>NR</span> NEON RACER</a>
      <div class="topbar-right"><span class="save-indicator"><i></i> LOCAL PROFILE</span><button id="sound-toggle" class="icon-button" aria-label="Toggle sound">♫ <span>ON</span></button></div>
    </header>
    <section class="stage" aria-live="polite">
      <canvas id="game-canvas" aria-label="Neon Racer game canvas"></canvas>
      <div id="screen-layer"></div>
      <div class="developer-watermark" aria-label="Developed by Makere">DEVELOPED BY <b>MAKERE</b></div>
      <div id="race-hud" class="race-hud" hidden>
        <div class="hud-top">
          <div class="hud-stat"><span class="hud-label">POSITION</span><strong id="hud-position">1<small> / 4</small></strong></div>
          <div class="hud-stat"><span class="hud-label">LAP</span><strong id="hud-lap">1<small> / 3</small></strong></div>
          <div class="hud-stat"><span class="hud-label">TIME</span><strong id="hud-time">00:00.00</strong></div>
          <div class="hud-stat best-stat"><span class="hud-label">BEST LAP</span><strong id="hud-best">--:--.--</strong></div>
          <button id="pause-button" class="pause-button" aria-label="Pause race">Ⅱ</button>
        </div>
        <div class="hud-bottom">
          <div class="speedometer"><strong id="hud-speed">000</strong><span>KM/H</span></div>
          <div class="nitro-box"><div class="nitro-title"><span>✦ NITRO</span><b id="nitro-state">READY</b></div><div class="nitro-track"><i id="nitro-fill"></i></div><small id="nitro-hint">HOLD SHIFT TO BOOST</small></div>
          <div class="drift-indicator" id="drift-indicator">DRIFT</div>
        </div>
        <div id="countdown" class="countdown" hidden>3</div>
        <div id="toast" class="toast" aria-live="assertive"></div>
      </div>
    </section>
    <footer class="footer"><span>© 2026 NEON RACER // STREET LEGENDS</span><span>BUILT FOR THE AFTER HOURS <b>◆</b></span></footer>
  </main>
  <script src="src/controls.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/player.js"></script>
  <script src="src/track.js"></script>
  <script src="src/opponent.js"></script>
  <script src="src/collision.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
